<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envision Painting &amp; Roofing — Be Right Back</title>
<style>
  :root{--brand:#2b8fd7;--ink:#0a1120;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;min-height:100%;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(700px 380px at 80% -10%, rgba(43,143,215,.45), transparent 60%),
      radial-gradient(600px 400px at 10% 110%, rgba(22,52,94,.5), transparent 60%),
      linear-gradient(135deg,#070b14 0%,#0e2140 55%,#15355f 100%);
    background-color:#0a1120;overflow:hidden;position:relative;
  }
  /* drifting blueprint grid */
  body::before{content:"";position:absolute;inset:-50px;
    background-image:linear-gradient(rgba(127,180,224,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,180,224,.07) 1px,transparent 1px);
    background-size:38px 38px;animation:drift 26s linear infinite;pointer-events:none;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 80%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 80%);}
  @keyframes drift{to{background-position:38px 38px,38px 38px;}}

  .card{position:relative;z-index:2;max-width:540px;width:100%;text-align:center;
    background:rgba(11,18,33,.55);border:1px solid rgba(127,180,224,.18);border-radius:22px;
    padding:48px 38px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .6s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  .logo{width:74px;height:74px;border-radius:16px;background:#0b0b0b;display:grid;place-items:center;padding:11px;margin:0 auto 22px;
    border:1px solid rgba(127,180,224,.25);box-shadow:0 0 28px rgba(43,143,215,.3);}
  .logo img{width:100%;height:100%;object-fit:contain;}

  .badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;color:#7fb4e0;margin-bottom:16px;}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:#f0a830;box-shadow:0 0 0 0 rgba(240,168,48,.6);animation:ping 2.2s ease-out infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(240,168,48,.55);}70%{box-shadow:0 0 0 11px rgba(240,168,48,0);}100%{box-shadow:0 0 0 0 rgba(240,168,48,0);}}

  h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-bottom:14px;}
  p{font-size:15.5px;line-height:1.6;color:#c9d6e8;max-width:42ch;margin:0 auto;}
  .sub{margin-top:18px;font-size:13px;color:#8fb0d4;}

  .bar{margin:28px auto 0;width:220px;height:6px;border-radius:999px;background:rgba(127,180,224,.15);overflow:hidden;}
  .bar>span{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#7fd0ff);
    animation:slide 1.8s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-120%);}100%{transform:translateX(360%);}}

  .foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;z-index:2;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:700;}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
</head>
